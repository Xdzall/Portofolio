<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/profile.jpg" type="image/jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("ghazali-theme");
        } catch {}
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <meta
      name="description"
      content="Muhammad Ghazali Nur Rahman — Full Stack Developer. Explore TapInAja, PT Merdeka Sejahtera, AutoChef, RKD websites, and software development experience at PT Panasonic Manufacturing Indonesia."
    />
    <title>Ghazali | Full Stack Developer</title>

    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
